<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 런처</title>
<link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="app-name">Claude 런처</span><span id="ver" class="ver"></span></div>
  <div id="chips" class="chips"></div>
  <div class="top-actions">
    <button id="btn-update" class="btn">업데이트 확인<span id="upd-badge" class="badge" hidden></span></button>
    <button id="btn-settings" class="btn">설정</button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<nav id="tabs" class="tabs" hidden aria-label="열린 세션"></nav>
<div id="view-projects" class="view">
  <section class="toolbar">
    <button id="btn-add" class="btn">폴더 추가</button>
    <button id="btn-split" class="btn">선택한 폴더를 분할 창으로 열기 (Windows Terminal)</button>
    <span id="sel-count" class="muted"></span>
    <span class="grow"></span>
    <span class="legend"><i class="dot split"></i>분담<i class="dot claude"></i>Claude만<i class="dot glm"></i>GLM만</span>
  </section>
  <div class="list-head" aria-hidden="true"><span></span><span>프로젝트</span><span>메인 (Claude 구독)</span><span>작업자 (GLM, z.ai)</span><span>열기</span><span></span></div>
  <main id="list" class="list"></main>
  <footer id="foot" class="foot"></footer>
</div>
<div id="view-term" class="view term-view" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="dlg" class="dlg"></dialog>
<dialog id="dlg-out" class="dlg"></dialog>
<script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
<script src="../../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
<script src="terminal.js"></script>
<script src="app.js"></script>
</body>
</html>
