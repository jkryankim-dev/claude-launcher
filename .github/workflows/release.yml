name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: '테스트 건너뛰기 (Windows 테스트가 실패해 급히 배포할 때만)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 버전과 저장소 설정
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npm pkg set version="${GITHUB_REF_NAME#v}"; fi
          npm pkg set repository.url="https://github.com/${GITHUB_REPOSITORY}.git"
      - name: 설치
        run: npm install --no-audit --no-fund
      - name: 테스트
        if: ${{ !inputs.skip_tests }}
        run: npm run test:ci
      - name: 실패한 테스트 공개 표시
        if: ${{ failure() && !inputs.skip_tests }}
        run: node test/ci-report.mjs test-results.tap
      - name: 빌드
        run: npx electron-builder --win nsis --publish never
      - name: 릴리스 올리기
        # electron-builder의 자체 업로드는 다 끝나기 전에 프로세스가 종료돼 파일이 빠지는 일이 있어(v1.1.0 blockmap, v1.2.0 exe·latest.yml) gh로 직접 올린다
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          ls -l dist/Claude-Launcher-Setup-*.exe dist/Claude-Launcher-Setup-*.exe.blockmap dist/latest.yml
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "" --draft
          gh release upload "$tag" --clobber dist/Claude-Launcher-Setup-*.exe dist/Claude-Launcher-Setup-*.exe.blockmap dist/latest.yml
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'
